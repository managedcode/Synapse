[workspace]
resolver = "3"
members = [
  "synapse-core",
  "synapse-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/managedcode/Synapse"
rust-version = "1.98.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
