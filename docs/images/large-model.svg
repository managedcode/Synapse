<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" font-family="Satoshi, 'Host Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Qwen2.5-7B on the Apple GPU: memory, speed, and first token</title>
  <desc id="desc">Qwen2.5-7B-Instruct-1M on a MacBook Pro M2 Pro GPU, FP16 KV cache, a 3,528-token prompt, 128 new tokens, one fresh process per row. Peak RSS: Synapse Q8_0 7,252 MiB; Synapse Q8_0 with 2 layers dropped 6,780; with 8 layers dropped 5,381 (+137% perplexity, experimental); Synapse Q4_K_M 4,233; llama.cpp Q8_0 8,109; llama.cpp Q4_K_M 4,846. Decode: Synapse Q4_K_M 18.2, llama.cpp Q4_K_M 29.3, Synapse Q8_0 17.9, llama.cpp Q8_0 17.7 tokens per second. Time to first token: 19.9, 12.2, 16.9, 10.8 seconds. On a chat prompt a Qwen2.5-0.5B draft raises Synapse Q8_0 decode from 17.4 to 23.5 tokens per second with the same output.</desc>
  <defs>
    <linearGradient id="syn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ed732e"/><stop offset="1" stop-color="#db3276"/></linearGradient>
  </defs>
  <style>
    .bgc { fill: #f9f7f5; stroke: #d3d8da; }
    .h { fill: #121212; }
    .t { fill: #161616; }
    .m { fill: #121212; fill-opacity: 0.6; }
    .ok { fill: #114e0b; }
    .panel { fill: #f2ede8; }
    .chip { fill: #ffffff; stroke: #d3d8da; }
    .llama { fill: #2d40ea; }
    .faded { fill-opacity: 0.55; }
    @media (prefers-color-scheme: dark) {
      .bgc { fill: #161616; stroke: #3a3a3a; }
      .h, .t { fill: #f9f7f5; }
      .m { fill: #f9f7f5; fill-opacity: 0.6; }
      .ok { fill: #6fcf7a; }
      .panel { fill: #ffffff; fill-opacity: 0.06; }
      .chip { fill: #ffffff; fill-opacity: 0.06; stroke: #ffffff; stroke-opacity: 0.25; }
      .llama { fill: #6d7bff; }
    }
  </style>

  <rect class="bgc" x="0.5" y="0.5" width="959" height="759" rx="24"/>

  <text class="h" x="36" y="50" font-size="24" font-weight="600">A 7B model on the Apple GPU, not loaded whole</text>
  <text class="m" x="36" y="76" font-size="13">Qwen2.5-7B-Instruct-1M · 3,528-token prompt · 128 new tokens · FP16 KV cache · one fresh process per row</text>

  <rect class="chip" x="36" y="92" width="300" height="26" rx="13"/>
  <text class="t" x="50" y="109" font-size="12">MacBook Pro · Apple M2 Pro · 19-core GPU</text>
  <rect x="356" y="98" width="14" height="14" rx="3" fill="url(#syn)"/>
  <text class="t" x="376" y="109" font-size="12">Synapse</text>
  <rect class="llama" x="438" y="98" width="14" height="14" rx="3"/>
  <text class="t" x="458" y="109" font-size="12">llama.cpp (same GGUF files)</text>

  <!-- Peak memory: bars start at x=296; 0.06906 px per MiB (llama.cpp Q8_0 8,109 MiB = 560 px). -->
  <rect class="panel" x="36" y="134" width="888" height="262" rx="18"/>
  <text class="h" x="54" y="162" font-size="15" font-weight="600">Peak memory</text>
  <text class="m" x="54" y="180" font-size="12">peak RSS in MiB, including the mapped weights · shorter is better</text>
  <g font-size="12">
    <text class="t" x="54" y="212">Synapse Q8_0</text>
    <rect x="296" y="200" width="500.8" height="16" rx="3" fill="url(#syn)"/><text class="t" x="803" y="213">7,252</text>
    <text class="t" x="54" y="240">Synapse Q8_0, 2 layers dropped</text>
    <rect x="296" y="228" width="468.2" height="16" rx="3" fill="url(#syn)"/><text class="t" x="770" y="241">6,780 · −1.1% perplexity</text>
    <text class="t" x="54" y="268">Synapse Q8_0, 8 layers dropped</text>
    <rect class="faded" x="296" y="256" width="371.6" height="16" rx="3" fill="url(#syn)"/><text class="t" x="674" y="269">5,381 · +137% perplexity</text>
    <text class="t" x="54" y="296" font-weight="600">Synapse Q4_K_M</text>
    <rect x="296" y="284" width="292.3" height="16" rx="3" fill="url(#syn)"/><text class="t" x="595" y="297" font-weight="600">4,233</text>
    <text class="t" x="54" y="324">llama.cpp Q8_0</text>
    <rect class="llama" x="296" y="312" width="560" height="16" rx="3"/><text class="t" x="862" y="325">8,109</text>
    <text class="t" x="54" y="352">llama.cpp Q4_K_M</text>
    <rect class="llama" x="296" y="340" width="334.7" height="16" rx="3"/><text class="t" x="637" y="353">4,846</text>
  </g>
  <text class="m" x="54" y="380" font-size="12">A dropped layer's weights and KV are never loaded (about 240 MiB each); only 2 of 28 layers are free to drop.</text>

  <!-- Decode: bars start at panel x + 150; 7.85 px per token/s (29.3 = 230 px). -->
  <rect class="panel" x="36" y="412" width="436" height="196" rx="18"/>
  <text class="h" x="54" y="440" font-size="15" font-weight="600">Writing speed</text>
  <text class="m" x="54" y="458" font-size="12">tokens per second · longer is better</text>
  <g font-size="12">
    <text class="t" x="54" y="492">Synapse Q4_K_M</text>
    <rect x="186" y="480" width="142.9" height="16" rx="3" fill="url(#syn)"/><text class="t" x="335" y="493">18.2</text>
    <text class="t" x="54" y="522">llama.cpp Q4_K_M</text>
    <rect class="llama" x="186" y="510" width="230" height="16" rx="3"/><text class="t" x="422" y="523">29.3</text>
    <text class="t" x="54" y="552">Synapse Q8_0</text>
    <rect x="186" y="540" width="140.5" height="16" rx="3" fill="url(#syn)"/><text class="t" x="333" y="553">17.9</text>
    <text class="t" x="54" y="582">llama.cpp Q8_0</text>
    <rect class="llama" x="186" y="570" width="139" height="16" rx="3"/><text class="t" x="331" y="583">17.7</text>
  </g>

  <!-- First token: bars start at panel x + 150; 11.56 px per second (19.9 s = 230 px). -->
  <rect class="panel" x="488" y="412" width="436" height="196" rx="18"/>
  <text class="h" x="506" y="440" font-size="15" font-weight="600">Time to first token</text>
  <text class="m" x="506" y="458" font-size="12">seconds for 3,528 prompt tokens · shorter is better</text>
  <g font-size="12">
    <text class="t" x="506" y="492">Synapse Q4_K_M</text>
    <rect x="638" y="480" width="230" height="16" rx="3" fill="url(#syn)"/><text class="t" x="874" y="493">19.9</text>
    <text class="t" x="506" y="522">llama.cpp Q4_K_M</text>
    <rect class="llama" x="638" y="510" width="141" height="16" rx="3"/><text class="t" x="785" y="523">12.2</text>
    <text class="t" x="506" y="552">Synapse Q8_0</text>
    <rect x="638" y="540" width="195.3" height="16" rx="3" fill="url(#syn)"/><text class="t" x="840" y="553">16.9</text>
    <text class="t" x="506" y="582">llama.cpp Q8_0</text>
    <rect class="llama" x="638" y="570" width="124.8" height="16" rx="3"/><text class="t" x="769" y="583">10.8</text>
  </g>

  <!-- Speculation on a chat prompt: 17.4 -> 23.5 tok/s; 9.36 px per token/s (23.5 = 220 px). -->
  <rect class="panel" x="36" y="624" width="888" height="72" rx="18"/>
  <text class="h" x="54" y="652" font-size="15" font-weight="600">Small draft, big check</text>
  <text class="m" x="54" y="672" font-size="12">chat prompt · Synapse Q8_0 · same output</text>
  <g font-size="12">
    <text class="t" x="330" y="652">alone</text>
    <rect x="420" y="640" width="162.9" height="14" rx="3" fill="url(#syn)" class="faded"/><text class="t" x="589" y="652">17.4 tok/s</text>
    <text class="t" x="330" y="678">+ 0.5B draft</text>
    <rect x="420" y="666" width="220" height="14" rx="3" fill="url(#syn)"/><text class="t" x="646" y="678">23.5 tok/s · 54% of drafts kept</text>
  </g>

  <text class="ok" x="36" y="722" font-size="13" font-weight="600">Tokens: for the pinned prompt Synapse writes llama.cpp's text with both files; Q4_K_M perplexity 11.93 against 12.16 for Q8_0.</text>
  <text class="m" x="36" y="744" font-size="12">Raw data: benchmarks/results/2026-09-29-m2-pro-qwen2.5-7b-1m-*.json (runs W, X, Y) · diagnostics, not a paired release verdict</text>
</svg>
