<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" font-family="Satoshi, 'Host Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Foundry Local: six models on the Mac</title>
  <desc id="desc">Foundry Local SDK 2.0.1 on a MacBook Pro with Apple M2 Pro, 128-token answer, context bounded to 1,024 tokens, median of 3 runs after 1 warm-up. Writing speed in tokens per second, first token in milliseconds, peak memory in MiB. CPU: Qwen2.5 0.5B 231.4, 65, 650. Qwen3 0.6B 124.3, 100, 1,493. Phi-3.5-mini 42.1, 448, 3,563. Phi-4-mini 28.6, 489, 4,413. Mistral 7B v0.2 25.2, 821, 5,132. DeepSeek-R1 7B 22.0, 685, 5,193. GPU through WebGPU: Qwen2.5 0.5B 142.3, 45, 809. GitHub Actions has 15 isolated jobs planned and not run yet.</desc>
  <style>
    .bgc { fill: #f9f7f5; stroke: #d3d8da; }
    .h { fill: #121212; }
    .t { fill: #161616; }
    .m { fill: #121212; fill-opacity: 0.6; }
    .card { fill: #f2ede8; }
    .warn { fill: #ff7e5d; fill-opacity: 0.16; }
    .warnt { fill: #b33a20; }
    .rule { stroke: #121212; stroke-opacity: 0.12; }
    .c-fl { fill: #1f7a48; }
    .c-gpu { fill: #283849; }
    .chip { fill: #ffffff; stroke: #d3d8da; }
    @media (prefers-color-scheme: dark) {
      .bgc { fill: #161616; stroke: #3a3a3a; }
      .h, .t { fill: #f9f7f5; }
      .m { fill: #f9f7f5; fill-opacity: 0.6; }
      .card { fill: #ffffff; fill-opacity: 0.06; }
      .warn { fill-opacity: 0.2; }
      .warnt { fill: #ff9b80; }
      .rule { stroke: #ffffff; stroke-opacity: 0.15; }
      .c-fl { fill: #6fcf7a; }
      .c-gpu { fill: #cbd5e1; }
      .chip { fill: #ffffff; fill-opacity: 0.06; stroke: #3a3a3a; }
    }
  </style>

  <rect class="bgc" x="0.5" y="0.5" width="959" height="623" rx="24"/>

  <text class="h" x="36" y="48" font-size="22" font-weight="600">Microsoft Foundry Local · 6 models · 4 families</text>
  <text class="m" x="36" y="72" font-size="12">SDK 2.0.1 · Microsoft's ONNX packages · 128-token answer · context 1,024 · runtime-default threads (about 6 cores) · median of 3 after 1 warm-up</text>

  <rect class="warn" x="36" y="90" width="888" height="34" rx="10"/>
  <text class="warnt" x="52" y="112" font-size="13" font-weight="600">A separate test: Foundry uses its own weights and thread count. Do not compare it bar-for-bar with the Q8_0 engines.</text>

  <rect class="card" x="36" y="142" width="888" height="378" rx="14"/>
  <text class="t" x="236" y="170" font-size="12" font-weight="600">Writing speed, tokens/s</text>
  <text class="t" x="476" y="170" font-size="12" font-weight="600">First token, ms (≈80-token prompt)</text>
  <text class="t" x="716" y="170" font-size="12" font-weight="600">Peak memory, MiB</text>

  <!-- Scales: speed 0.77 px per token/s, first token 0.2 px per ms, memory 0.03 px per MiB. -->
  <g font-size="12">
    <text class="h" x="52" y="200" font-size="13" font-weight="600">Qwen2.5 0.5B</text>
    <text class="m" x="52" y="215" font-size="11">Qwen · CPU · 0.8 GB file</text>
    <rect class="c-fl" x="236" y="192" width="178.2" height="14" rx="3"/>
    <text class="t" x="420.2" y="203">231.4</text>
    <rect class="c-fl" x="476" y="192" width="13" height="14" rx="3"/>
    <text class="t" x="495" y="203">65</text>
    <rect class="c-fl" x="716" y="192" width="19.5" height="14" rx="3"/>
    <text class="t" x="741.5" y="203">650</text>

    <text class="h" x="52" y="244" font-size="13" font-weight="600">Qwen3 0.6B *</text>
    <text class="m" x="52" y="259" font-size="11">Qwen · CPU · 0.6 GB file</text>
    <rect class="c-fl" x="236" y="236" width="95.7" height="14" rx="3"/>
    <text class="t" x="337.7" y="247">124.3</text>
    <rect class="c-fl" x="476" y="236" width="20" height="14" rx="3"/>
    <text class="t" x="502" y="247">100</text>
    <rect class="c-fl" x="716" y="236" width="44.8" height="14" rx="3"/>
    <text class="t" x="766.8" y="247">1,493</text>

    <text class="h" x="52" y="288" font-size="13" font-weight="600">Phi-3.5-mini</text>
    <text class="m" x="52" y="303" font-size="11">Phi · CPU · 2.6 GB file</text>
    <rect class="c-fl" x="236" y="280" width="32.4" height="14" rx="3"/>
    <text class="t" x="274.4" y="291">42.1</text>
    <rect class="c-fl" x="476" y="280" width="89.6" height="14" rx="3"/>
    <text class="t" x="571.6" y="291">448</text>
    <rect class="c-fl" x="716" y="280" width="106.9" height="14" rx="3"/>
    <text class="t" x="828.9" y="291">3,563</text>

    <text class="h" x="52" y="332" font-size="13" font-weight="600">Phi-4-mini</text>
    <text class="m" x="52" y="347" font-size="11">Phi · CPU · 4.9 GB file</text>
    <rect class="c-fl" x="236" y="324" width="22" height="14" rx="3"/>
    <text class="t" x="264" y="335">28.6</text>
    <rect class="c-fl" x="476" y="324" width="97.8" height="14" rx="3"/>
    <text class="t" x="579.8" y="335">489</text>
    <rect class="c-fl" x="716" y="324" width="132.4" height="14" rx="3"/>
    <text class="t" x="854.4" y="335">4,413</text>

    <text class="h" x="52" y="376" font-size="13" font-weight="600">Mistral 7B v0.2 †</text>
    <text class="m" x="52" y="391" font-size="11">Mistral · CPU · 4.2 GB file</text>
    <rect class="c-fl" x="236" y="368" width="19.4" height="14" rx="3"/>
    <text class="t" x="261.4" y="379">25.2</text>
    <rect class="c-fl" x="476" y="368" width="164.2" height="14" rx="3"/>
    <text class="t" x="646.2" y="379">821</text>
    <rect class="c-fl" x="716" y="368" width="154" height="14" rx="3"/>
    <text class="t" x="876" y="379">5,132</text>

    <text class="h" x="52" y="420" font-size="13" font-weight="600">DeepSeek-R1 7B *</text>
    <text class="m" x="52" y="435" font-size="11">DeepSeek · CPU · 6.6 GB file</text>
    <rect class="c-fl" x="236" y="412" width="16.9" height="14" rx="3"/>
    <text class="t" x="258.9" y="423">22.0</text>
    <rect class="c-fl" x="476" y="412" width="137" height="14" rx="3"/>
    <text class="t" x="619" y="423">685</text>
    <rect class="c-fl" x="716" y="412" width="155.8" height="14" rx="3"/>
    <text class="t" x="877.8" y="423">5,193</text>

    <line class="rule" x1="52" y1="448" x2="908" y2="448"/>

    <text class="h" x="52" y="478" font-size="13" font-weight="600">Qwen2.5 0.5B</text>
    <text class="m" x="52" y="493" font-size="11">Qwen · GPU (WebGPU) · 0.7 GB</text>
    <rect class="c-gpu" x="236" y="470" width="109.6" height="14" rx="3"/>
    <text class="t" x="351.6" y="481">142.3</text>
    <rect class="c-gpu" x="476" y="470" width="9" height="14" rx="3"/>
    <text class="t" x="491" y="481">45</text>
    <rect class="c-gpu" x="716" y="470" width="24.3" height="14" rx="3"/>
    <text class="t" x="746.3" y="481">809</text>
    <text class="m" x="236" y="505" font-size="11">GPU uses 0.6 CPU cores instead of 6. It stopped at 99 tokens.</text>
  </g>

  <text class="m" x="36" y="540" font-size="11">* Writes reasoning text before the answer; every generated token is counted.</text>
  <text class="m" x="36" y="556" font-size="11">† Its chat template has no system role, so the system prompt opens the first user message.</text>

  <rect class="chip" x="36" y="570" width="372" height="30" rx="15"/>
  <text class="t" x="52" y="590" font-size="12">MacBook Pro · Apple M2 Pro · 12 cores · 32 GB · macOS 27</text>
  <rect class="chip" x="420" y="570" width="504" height="30" rx="15"/>
  <text class="t" x="436" y="590" font-size="12">GitHub: 15 isolated jobs planned (macOS 3, Ubuntu 6, Windows 6), not run yet</text>
</svg>
