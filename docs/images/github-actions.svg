    <rect x="92" y="162" width="20.6" height="15" rx="3" fill="url(#dot)"/>
    <text class="t" x="118.6" y="174" font-size="12">14.7</text>

    <text class="t" x="16" y="208" font-size="12" font-weight="600">Peak memory, MiB</text>
    <text class="s" x="84" y="230" font-size="12" font-weight="600" text-anchor="end">Synapse</text>
    <rect x="92" y="218" width="59.3" height="15" rx="3" fill="url(#syn)"/>
    <text class="h" x="157.3" y="230" font-size="12" font-weight="600">551</text>
    <text class="t" x="84" y="254" font-size="12" text-anchor="end">llama.cpp</text>
    <rect x="92" y="242" width="61.9" height="15" rx="3" fill="url(#llama)"/>
    <text class="t" x="159.9" y="254" font-size="12">575</text>
    <text class="t" x="84" y="278" font-size="12" text-anchor="end">LLamaSharp</text>
    <rect x="92" y="266" width="64.2" height="15" rx="3" fill="url(#sharp)"/>
