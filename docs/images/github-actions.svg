<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Satoshi, 'Host Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actions performance run on macOS, Ubuntu, and Windows</title>
  <desc id="desc">Run 36405097376 with the committed first scalar version of Synapse, 2 threads, median of 5 runs. Writing speed in tokens per second. macOS 15 on Apple M1: Synapse 5.2, llama.cpp 90.1, LLamaSharp 76.8, dotLLM 6.5. Ubuntu 24.04 x64: Synapse 4.6, llama.cpp 54.8, LLamaSharp 39.4, dotLLM 16.6. Windows Server 2025 x64: Synapse 4.0, llama.cpp 45.5, LLamaSharp 33.8, dotLLM 14.7. Peak memory in MiB. macOS: 555, 1,195, 1,263, 1,166. Ubuntu: 565, 725, 760, 1,174. Windows: 551, 575, 596, 1,153.</desc>
  <defs>
    <linearGradient id="syn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ed732e"/><stop offset="1" stop-color="#db3276"/></linearGradient>
    <linearGradient id="llama" x1="0" y1="0" x2="1" y2="0"><stop class="c-llama" offset="0"/><stop class="c-llama" offset="1"/></linearGradient>
    <linearGradient id="sharp" x1="0" y1="0" x2="1" y2="0"><stop class="c-sharp" offset="0"/><stop class="c-sharp" offset="1"/></linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="0"><stop class="c-dot" offset="0"/><stop class="c-dot" offset="1"/></linearGradient>
  </defs>
  <style>
    .bgc { fill: #f9f7f5; stroke: #d3d8da; }
    .h { fill: #121212; }
    .t { fill: #161616; }
    .m { fill: #121212; fill-opacity: 0.6; }
    .s { fill: #b33a20; }
    .bad { fill: #d71c21; }
    .good { fill: #114e0b; }
    .even { fill: #283849; }
    .card { fill: #f2ede8; }
    .warn { fill: #ff7e5d; fill-opacity: 0.16; }
    .warnt { fill: #b33a20; }
    .rule { stroke: #121212; stroke-opacity: 0.12; }
    .c-llama { stop-color: #2d40ea; }
    .c-sharp { stop-color: #cfa37e; }
    .c-dot { stop-color: #9aa3ab; }
    @media (prefers-color-scheme: dark) {
      .bgc { fill: #161616; stroke: #3a3a3a; }
      .h, .t { fill: #f9f7f5; }
      .m { fill: #f9f7f5; fill-opacity: 0.6; }
      .s { fill: #ff7e5d; }
      .bad { fill: #ff6b6b; }
      .good { fill: #6fcf7a; }
      .even { fill: #cbd5e1; }
      .card { fill: #ffffff; fill-opacity: 0.06; }
      .warn { fill-opacity: 0.2; }
      .warnt { fill: #ff9b80; }
      .rule { stroke: #ffffff; stroke-opacity: 0.15; }
      .c-llama { stop-color: #6d7bff; }
      .c-dot { stop-color: #6b7680; }
    }
  </style>

  <rect class="bgc" x="0.5" y="0.5" width="959" height="579" rx="24"/>

  <text class="h" x="36" y="48" font-size="22" font-weight="600">GitHub Actions · 3 operating systems</text>
  <text class="m" x="36" y="72" font-size="12">Qwen2.5 0.5B Q8_0 · 8-token answer · 2 threads · median of 5 runs after 3 warm-ups · same answer everywhere · run 36405097376</text>

  <rect class="warn" x="36" y="90" width="888" height="34" rx="10"/>
  <text class="warnt" x="52" y="112" font-size="13" font-weight="600">GitHub runs the committed code: still the first scalar version. The new kernels (102% of llama.cpp) are not pushed yet.</text>

  <!-- macOS 15 · speed scale 1.4 px per token/s · memory scale 0.10769 px per MiB -->
  <g transform="translate(36,142)">
    <rect class="card" width="284" height="384" rx="14"/>
    <text class="h" x="16" y="30" font-size="16" font-weight="600">macOS 15</text>
    <text class="m" x="16" y="49" font-size="12">Apple M1 · 3 vCPU · 7 GB · arm64</text>
    <text class="t" x="16" y="80" font-size="12" font-weight="600">Writing speed, tokens/s</text>
    <text class="s" x="84" y="102" font-size="12" font-weight="600" text-anchor="end">Synapse</text>
    <rect x="92" y="90" width="7.3" height="15" rx="3" fill="url(#syn)"/>
    <text class="h" x="105.3" y="102" font-size="12" font-weight="600">5.2</text>
    <text class="t" x="84" y="126" font-size="12" text-anchor="end">llama.cpp</text>
    <rect x="92" y="114" width="126.1" height="15" rx="3" fill="url(#llama)"/>
    <text class="t" x="224.1" y="126" font-size="12">90.1</text>
    <text class="t" x="84" y="150" font-size="12" text-anchor="end">LLamaSharp</text>
    <rect x="92" y="138" width="107.5" height="15" rx="3" fill="url(#sharp)"/>
    <text class="t" x="205.5" y="150" font-size="12">76.8</text>
    <text class="t" x="84" y="174" font-size="12" text-anchor="end">dotLLM</text>
    <rect x="92" y="162" width="9.1" height="15" rx="3" fill="url(#dot)"/>
    <text class="t" x="107.1" y="174" font-size="12">6.5</text>

    <text class="t" x="16" y="208" font-size="12" font-weight="600">Peak memory, MiB</text>
    <text class="s" x="84" y="230" font-size="12" font-weight="600" text-anchor="end">Synapse</text>
    <rect x="92" y="218" width="59.8" height="15" rx="3" fill="url(#syn)"/>
    <text class="h" x="157.8" y="230" font-size="12" font-weight="600">555</text>
    <text class="t" x="84" y="254" font-size="12" text-anchor="end">llama.cpp</text>
    <rect x="92" y="242" width="128.7" height="15" rx="3" fill="url(#llama)"/>
    <text class="t" x="226.7" y="254" font-size="12">1,195</text>
    <text class="t" x="84" y="278" font-size="12" text-anchor="end">LLamaSharp</text>
    <rect x="92" y="266" width="136" height="15" rx="3" fill="url(#sharp)"/>
    <text class="t" x="234" y="278" font-size="12">1,263</text>
    <text class="t" x="84" y="302" font-size="12" text-anchor="end">dotLLM</text>
    <rect x="92" y="290" width="125.6" height="15" rx="3" fill="url(#dot)"/>
    <text class="t" x="223.6" y="302" font-size="12">1,166</text>

    <path class="rule" d="M16,324 L268,324"/>
    <text class="bad" x="16" y="348" font-size="13" font-weight="600">Speed: 6% of llama.cpp</text>
    <text class="good" x="16" y="369" font-size="13" font-weight="600">Memory: 2.2× less</text>
  </g>

