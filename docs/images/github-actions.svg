    <rect x="92" y="114" width="76.7" height="15" rx="3" fill="url(#llama)"/>
    <text class="t" x="174.7" y="126" font-size="12">54.8</text>
    <text class="t" x="84" y="150" font-size="12" text-anchor="end">LLamaSharp</text>
    <rect x="92" y="138" width="55.2" height="15" rx="3" fill="url(#sharp)"/>
    <text class="t" x="153.2" y="150" font-size="12">39.4</text>
    <text class="t" x="84" y="174" font-size="12" text-anchor="end">dotLLM</text>
    <rect x="92" y="162" width="23.2" height="15" rx="3" fill="url(#dot)"/>
    <text class="t" x="121.2" y="174" font-size="12">16.6</text>

    <text class="t" x="16" y="208" font-size="12" font-weight="600">Peak memory, MiB</text>
    <text class="s" x="84" y="230" font-size="12" font-weight="600" text-anchor="end">Synapse</text>
    <rect x="92" y="218" width="60.9" height="15" rx="3" fill="url(#syn)"/>
    <text class="h" x="158.9" y="230" font-size="12" font-weight="600">565</text>
    <text class="t" x="84" y="254" font-size="12" text-anchor="end">llama.cpp</text>
    <rect x="92" y="242" width="78" height="15" rx="3" fill="url(#llama)"/>
    <text class="t" x="176" y="254" font-size="12">725</text>
    <text class="t" x="84" y="278" font-size="12" text-anchor="end">LLamaSharp</text>
    <rect x="92" y="266" width="81.9" height="15" rx="3" fill="url(#sharp)"/>
    <text class="t" x="179.9" y="278" font-size="12">760</text>
    <text class="t" x="84" y="302" font-size="12" text-anchor="end">dotLLM</text>
    <rect x="92" y="290" width="126.4" height="15" rx="3" fill="url(#dot)"/>
    <text class="t" x="224.4" y="302" font-size="12">1,174</text>

    <path class="rule" d="M16,324 L268,324"/>
    <text class="bad" x="16" y="348" font-size="13" font-weight="600">Speed: 8% of llama.cpp</text>
    <text class="good" x="16" y="369" font-size="13" font-weight="600">Memory: 1.3× less</text>
  </g>

