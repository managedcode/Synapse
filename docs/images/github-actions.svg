  <g transform="translate(640,142)">
    <rect class="card" width="284" height="384" rx="14"/>
    <text class="h" x="16" y="30" font-size="16" font-weight="600">Windows Server 2025</text>
    <text class="m" x="16" y="49" font-size="12">x64 · 4 vCPU · 16 GB</text>
    <text class="t" x="16" y="80" font-size="12" font-weight="600">Writing speed, tokens/s</text>
    <text class="s" x="84" y="102" font-size="12" font-weight="600" text-anchor="end">Synapse</text>
    <rect x="92" y="90" width="5.6" height="15" rx="3" fill="url(#syn)"/>
    <text class="h" x="103.6" y="102" font-size="12" font-weight="600">4.0</text>
    <text class="t" x="84" y="126" font-size="12" text-anchor="end">llama.cpp</text>
    <rect x="92" y="114" width="63.7" height="15" rx="3" fill="url(#llama)"/>
    <text class="t" x="161.7" y="126" font-size="12">45.5</text>
    <text class="t" x="84" y="150" font-size="12" text-anchor="end">LLamaSharp</text>
    <rect x="92" y="138" width="47.3" height="15" rx="3" fill="url(#sharp)"/>
